name: Code Knowledge Base Scanner

on:
  workflow_dispatch:
    inputs:
      languages:
        description: 'Comma-separated list of CodeQL languages (python, javascript, java, go, cpp, csharp, ruby). Leave empty for auto-detect.'
        required: false
        type: string

jobs:
  treesitter:
    name: AST Extraction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tree-sitter
        run: |
          pip install tree-sitter
          pip install tree-sitter-python tree-sitter-javascript tree-sitter-typescript
          pip install tree-sitter-java tree-sitter-go tree-sitter-ruby

      - name: Run AST extractor
        run: python .github/scripts/extract_ast.py --output ast.json

      - name: Upload AST artifact
        uses: actions/upload-artifact@v4
        with:
          name: ast-results
          path: ast.json
          retention-days: 30

  codeql-structural:
    name: CodeQL Structural Extraction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CodeQL CLI
        uses: github/codeql-action/init@v3
        with:
          languages: java
          build-mode: none

      - name: Run Structural Analysis
        run: |
          mkdir -p queries
          cp .github/scripts/queries/*.ql queries/ 2>/dev/null || true
          
          # Create python aggregator script
          cat << 'EOF' > aggregate.py
          import json
          import os

          result = {"method_signatures": [], "call_graph": [], "annotation_values": []}
          if os.path.exists("structural.json"):
              with open("structural.json") as f:
                  result = json.load(f)

          with open("codeql_structural.json", "w") as f:
              json.dump(result, f, indent=2)
          print("Aggregated codeql_structural.json")
          EOF

          python3 aggregate.py

      - name: Upload Structural Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-structural
          path: codeql_structural.json
          retention-days: 30

